<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic video page with a transcript panel (YouTube-like, not YouTube)</title>
  </head>
  <body>
    <h1>Synthetic transcript panel: one row per caption, M:SS start times</h1>
    <div id="transcript">
      <div class="segment"><div class="segment-timestamp">1:19</div><div class="segment-text">So the first thing we do is open the settings</div></div>
      <div class="segment"><div class="segment-timestamp">1:20</div><div class="segment-text">page and look for the export button.</div></div>
      <div class="segment"><div class="segment-timestamp">1:22</div><div class="segment-text">The meeting starts at 9:30.</div></div>
      <div class="segment"><div class="segment-timestamp">1:24</div><div class="segment-text">so please be on time,</div></div>
      <div class="segment"><div class="segment-timestamp">1:25</div><div class="segment-text">and bring your notes from Monday.</div></div>
      <div class="segment"><div class="segment-timestamp">1:27</div><div class="segment-text">That's it for today.</div></div>
    </div>
  </body>
</html>
