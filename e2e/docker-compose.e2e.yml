# Isolated stack for the browser E2E suite (see e2e/README.md).
#
# Its own Compose project, its own PostgreSQL on tmpfs (no volume, no published port),
# and mock providers only. It never touches the development database. `run-e2e.sh`
# removes the whole stack, including its data, when the run ends.
name: mydubb-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mydubb_e2e
      POSTGRES_PASSWORD: e2e_only_not_secret
      POSTGRES_DB: mydubb_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydubb_e2e -d mydubb_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://mydubb_e2e:e2e_only_not_secret@db:5432/mydubb_e2e
      # Set by run-e2e.sh; the app refuses to start if it is empty.
      ACCESS_CODE: ${E2E_ACCESS_CODE:-}
      PROVIDER_MODE: mock
      # Long enough for the UI to observe intermediate stages.
      MOCK_STAGE_DELAY_SECONDS: "1.0"
      # Fixed captions instead of Supadata (no network, no key); the delay above applies too.
      YOUTUBE_IMPORT_PROVIDER: mock
      COOKIE_SECURE: "false"
      # Each test signs in separately; one test deliberately uses a wrong code.
      ACCESS_MAX_FAILURES_PER_CLIENT: "20"
    ports:
      - "127.0.0.1:${E2E_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 2s
      timeout: 4s
      retries: 45
      start_period: 5s

  # Second stack: the same image in AUTH_MODE=cognito, with an in-memory stand-in for the user
  # pool instead of Amazon Cognito (see fake-cognito/serve.py). Its own database; no AWS call.
  db-cognito:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mydubb_e2e
      POSTGRES_PASSWORD: e2e_only_not_secret
      POSTGRES_DB: mydubb_e2e_cognito
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydubb_e2e -d mydubb_e2e_cognito"]
      interval: 2s
      timeout: 3s
      retries: 30

  app-cognito:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db-cognito:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - alembic upgrade head && exec python /e2e/serve.py
    environment:
      PYTHONPATH: /app
      APP_ENV: development
      DATABASE_URL: postgresql://mydubb_e2e:e2e_only_not_secret@db-cognito:5432/mydubb_e2e_cognito
      AUTH_MODE: cognito
      COGNITO_REGION: us-west-2
      COGNITO_USER_POOL_ID: us-west-2_E2EOnlyPool
      COGNITO_CLIENT_ID: e2eonlyclientid
      # Generated by run-e2e.sh for each run; the app refuses to start if it is empty.
      AUTH_TOKEN_ENCRYPTION_KEY: ${E2E_AUTH_KEY:-}
      # "Try as guest", with its own random key per run. The guest specs send their own client
      # address in this header (one per test, so tests never share a network quota); in
      # production the header is cf-connecting-ip, which the edge overwrites.
      GUEST_ACCESS_ENABLED: "true"
      GUEST_IP_HASH_KEY: ${E2E_GUEST_KEY:-}
      CLIENT_IP_HEADER: x-e2e-client-ip
      # Fixed captions (no network), so the guest specs can check that accounts are offered the
      # import and guests are not.
      YOUTUBE_IMPORT_PROVIDER: mock
      PROVIDER_MODE: mock
      MOCK_STAGE_DELAY_SECONDS: "1.0"
      COOKIE_SECURE: "false"
      # Tests sign in and ask for codes many times from one address.
      ACCESS_MAX_FAILURES_PER_CLIENT: "200"
      ACCESS_MAX_FAILURES_GLOBAL: "1000"
      AUTH_RECOVERY_MAX_PER_CLIENT: "500"
      AUTH_RECOVERY_MAX_PER_EMAIL: "500"
      AUTH_RECOVERY_MAX_GLOBAL: "1000"
    volumes:
      - ./fake-cognito/serve.py:/e2e/serve.py:ro
      - ../backend/tests/fake_cognito.py:/e2e-fake/fake_cognito.py:ro
    ports:
      - "127.0.0.1:${E2E_COGNITO_PORT:-8003}:8000"
      # Test control (create users, read codes); the stand-in's "administrator and inbox".
      - "127.0.0.1:${E2E_CONTROL_PORT:-8004}:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3); urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"
      interval: 2s
      timeout: 4s
      retries: 45
      start_period: 5s
