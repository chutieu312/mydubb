name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No deployment, no secrets.
# Actions are pinned to full commit SHAs verified against the upstream release tags.
# Triggered by pull_request (never pull_request_target), so fork code runs without secrets.
permissions:
  contents: read

# Superseded PR runs are cancelled; every commit pushed to main keeps a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mydubb
          POSTGRES_PASSWORD: mydubb_ci # throwaway CI-only database
          POSTGRES_DB: mydubb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydubb -d mydubb_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # FFmpeg/ffprobe: the audio tests encode and verify real MP3 files (the runtime image
      # installs the same programs). Tests fail, not skip, when they are missing in CI.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Migrations on an empty database (upgrade, downgrade, upgrade)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests (PostgreSQL integration)
        run: uv run pytest -v

  docker:
    name: Docker image build and container startup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mydubb
          POSTGRES_PASSWORD: mydubb_ci # throwaway CI-only database
          POSTGRES_DB: mydubb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydubb -d mydubb"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Non-secret value used only inside this ephemeral CI container.
      ACCESS_CODE: ci-only-access-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t mydubb:ci .
      - name: Start container
        run: |
          docker run -d --name mydubb --network host \
            -e APP_ENV=development \
            -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb \
            -e ACCESS_CODE \
            -e PROVIDER_MODE=mock \
            -e COOKIE_SECURE=false \
            mydubb:ci
      - name: Smoke test (health, readiness, frontend, mock job)
        run: sh docker/smoke-test.sh
      - name: Container is still running
        run: test "$(docker inspect -f '{{.State.Running}}' mydubb)" = "true"
      # Same image with the production configuration used on Render (online mock beta).
      # It also exercises a second instance starting against an already migrated database.
      - name: Start container with the production configuration
        run: |
          docker run -d --name mydubb-prod --network host             -e PORT=8081             -e APP_ENV=production             -e PROVIDER_MODE=mock             -e ALLOW_MOCK_PROVIDERS_IN_PRODUCTION=true             -e COOKIE_SECURE=true             -e CLIENT_IP_HEADER=cf-connecting-ip             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE             mydubb:ci
      - name: Production configuration check
        env:
          BASE_URL: http://127.0.0.1:8081
        run: sh docker/production-config-check.sh
      # Azure translation + mock speech/audio with a fake key. Azure is never called (no job
      # is created); this proves the image has the glossary and HTTP client and labels each
      # component. Real Azure is only exercised by the manual live smoke test.
      - name: Start container with Azure translation configuration
        run: |
          docker run -d --name mydubb-azure --network host             -e PORT=8082             -e APP_ENV=development             -e PROVIDER_MODE=mock             -e TRANSLATION_PROVIDER=azure             -e AZURE_TRANSLATOR_KEY=ci-only-fake-key             -e COOKIE_SECURE=false             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE             mydubb:ci
      - name: Azure translation configuration check
        env:
          BASE_URL: http://127.0.0.1:8082
        run: sh docker/azure-mode-check.sh
      - name: Azure translation without a key refuses to start
        run: |
          set +e
          out=$(docker run --rm --network host -e PORT=8083 -e APP_ENV=development             -e PROVIDER_MODE=mock -e TRANSLATION_PROVIDER=azure -e COOKIE_SECURE=false             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE mydubb:ci 2>&1)
          status=$?
          echo "$out" | tail -5
          [ "$status" -ne 0 ] || { echo "container started without a key" >&2; exit 1; }
          echo "$out" | grep -q AZURE_TRANSLATOR_KEY
      # Azure translation + Azure speech with fake keys. Azure is never called (no job is
      # created); startup proves the image contains ffmpeg/ffprobe. Real Azure Speech is only
      # exercised by the manual live smoke test.
      - name: Start container with Azure translation and speech configuration
        run: |
          docker run -d --name mydubb-speech --network host             -e PORT=8084             -e APP_ENV=development             -e PROVIDER_MODE=mock             -e TRANSLATION_PROVIDER=azure             -e AZURE_TRANSLATOR_KEY=ci-only-fake-key             -e SPEECH_PROVIDER=azure             -e AZURE_SPEECH_KEY=ci-only-fake-speech-key             -e AZURE_SPEECH_REGION=westus2             -e COOKIE_SECURE=false             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE             mydubb:ci
      - name: Azure translation and speech configuration check
        env:
          BASE_URL: http://127.0.0.1:8084
        run: sh docker/azure-speech-mode-check.sh
      # Real FFmpeg and ffprobe inside the runtime image: several fake-Azure chunks are joined
      # and encoded to an MP3 that is then probed. No credentials, no network.
      - name: Speech audio runtime check (real FFmpeg in the image)
        run: docker exec -i mydubb python - < docker/speech_runtime_check.py
      # Real FFmpeg in the runtime image fits synthetic speech to exact durations (faster and
      # slower, several chained atempo filters) and measures each MP3 three ways.
      - name: Audio duration runtime check (real FFmpeg in the image)
        run: docker exec -i mydubb python - < docker/audio_runtime_check.py
      - name: Azure speech without a key refuses to start
        run: |
          set +e
          out=$(docker run --rm --network host -e PORT=8085 -e APP_ENV=development             -e PROVIDER_MODE=mock -e SPEECH_PROVIDER=azure -e AZURE_SPEECH_REGION=westus2             -e AZURE_TRANSLATOR_KEY=ci-only-fake-key -e TRANSLATION_PROVIDER=azure             -e COOKIE_SECURE=false             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE mydubb:ci 2>&1)
          status=$?
          echo "$out" | tail -5
          [ "$status" -ne 0 ] || { echo "container started without a speech key" >&2; exit 1; }
          echo "$out" | grep -q AZURE_SPEECH_KEY
      # Every component real (PROVIDER_MODE=azure) with fake keys. Azure is never called (no job
      # is created); startup proves the image's FFmpeg has atempo and libmp3lame.
      - name: Start container with the full Azure configuration
        run: |
          docker run -d --name mydubb-full --network host             -e PORT=8086             -e APP_ENV=development             -e PROVIDER_MODE=azure             -e TRANSLATION_PROVIDER=azure             -e AZURE_TRANSLATOR_KEY=ci-only-fake-key             -e SPEECH_PROVIDER=azure             -e AZURE_SPEECH_KEY=ci-only-fake-speech-key             -e AZURE_SPEECH_REGION=westus2             -e AUDIO_PROCESSOR=ffmpeg             -e COOKIE_SECURE=false             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE             mydubb:ci
      - name: Full Azure configuration check
        env:
          BASE_URL: http://127.0.0.1:8086
        run: sh docker/azure-full-mode-check.sh
      - name: Full Azure mode with a mock component refuses to start
        run: |
          set +e
          out=$(docker run --rm --network host -e PORT=8087 -e APP_ENV=development             -e PROVIDER_MODE=azure -e TRANSLATION_PROVIDER=azure -e AZURE_TRANSLATOR_KEY=ci-only-fake-key             -e SPEECH_PROVIDER=azure -e AZURE_SPEECH_KEY=ci-only-fake-speech-key             -e AZURE_SPEECH_REGION=westus2 -e COOKIE_SECURE=false             -e DATABASE_URL=postgresql://mydubb:mydubb_ci@127.0.0.1:5432/mydubb             -e ACCESS_CODE mydubb:ci 2>&1)
          status=$?
          echo "$out" | tail -5
          [ "$status" -ne 0 ] || { echo "container started with a mock audio processor" >&2; exit 1; }
          echo "$out" | grep -q AUDIO_PROCESSOR=ffmpeg
      - name: Container logs
        if: always()
        run: |
          docker logs mydubb || true
          docker logs mydubb-prod || true
          docker logs mydubb-azure || true
          docker logs mydubb-speech || true
          docker logs mydubb-full || true

  e2e:
    name: Browser E2E (Playwright, mock providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Non-secret value used only by the throwaway E2E stack.
      E2E_ACCESS_CODE: ci-only-e2e-access-code
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite against an isolated Docker stack
        run: bash run-e2e.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          # Mock data and the CI-only E2E access code only; kept briefly.
          retention-days: 5
          if-no-files-found: ignore

  # Single required status check for branch protection. Always runs; succeeds only if
  # every mandatory job succeeded (skipped or cancelled jobs count as failure).
  ci-success:
    name: CI success
    if: always()
    needs: [frontend, backend, docker, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify mandatory checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length == 4 and (to_entries | all(.value.result == "success"))' > /dev/null
