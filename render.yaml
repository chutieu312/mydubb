# Render Blueprint: MyDubb online Private Beta (real providers since Milestone 3C).
# Setup steps: docs/DEPLOYMENT.md. No secrets are stored in this file.
services:
  - type: web
    name: mydubb
    runtime: docker
    plan: free
    # Closest Render region to California (US West). Cannot be changed after creation.
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render never deploys on its own. The "Deploy to Render" job of .github/workflows/ci.yml
    # (after "CI success" on main) is the only automatic trigger, so a Blueprint sync must not turn
    # auto-deploy back on: `checksPass` would wait for that very job while the job waits for Render.
    # Render applies this value when the file reaches main. Rollback: docs/WORKFLOW.md, "Cutover".
    autoDeployTrigger: "off"
    # Liveness only: a slow Neon wake-up must not make Render restart the service.
    healthCheckPath: /api/health
    # Render adds www.mydubb.com automatically and redirects it to the root domain.
    domains:
      - mydubb.com
    envVars:
      - key: APP_ENV
        value: production
      # Every component is real: the service refuses to start unless TRANSLATION_PROVIDER=azure,
      # SPEECH_PROVIDER=azure and AUDIO_PROCESSOR=ffmpeg (with their keys, entered in the Render
      # dashboard) are all set, so a mock can never run in production by accident.
      - key: PROVIDER_MODE
        value: azure
      - key: COOKIE_SECURE
        value: "true"
      # Neon direct (non-pooler) connection string, entered in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Random 256-bit value generated by Render; read it in the dashboard to log in.
      - key: ACCESS_CODE
        generateValue: true
      # Render's proxy is the only way in; the real client IP for brute-force protection
      # comes from the edge header (verify after the first deploy, docs/DEPLOYMENT.md).
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: MOCK_STAGE_DELAY_SECONDS
        value: "1.5"
      - key: JOB_MAX_CONCURRENCY
        value: "2"
      # Render Free uses the default 30 s between SIGTERM and SIGKILL (not configurable
      # there), so running jobs get 20 s to finish before the rest are marked interrupted.
      - key: JOB_SHUTDOWN_GRACE_SECONDS
        value: "20"
      - key: LOG_LEVEL
        value: INFO
